name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src/ tests/
      - run: uv run black --check src/pycartosym/ tests/
      - run: uv run mypy src/pycartosym/
      - run: uvx --from python-kacl==0.7.7 kacl-cli verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor, one middle, ceiling — enough to catch version-specific
        # breakage without a 5-wide fan-out
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest
